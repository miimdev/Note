name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push cancels the queued run but never an
# in-flight deploy (cancelling mid-deploy can leave Pages in a broken state).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    # Declaring the environment lets this job read values that were stored at the
    # *environment* level (Settings -> Environments -> github-pages) as well as
    # repository-level ones. Without it, environment-scoped values are invisible.
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build static export
        # Every NEXT_PUBLIC_* value is inlined into the browser bundle; the anon
        # key is designed to be public (RLS enforces access). No service-role key
        # is ever passed here: scripts/post-export.mjs fails the build if one is
        # found in the artifact.
        env:
          # Accept both locations: it is easy to store the anon key as a Secret.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optional: defaults to the Pages URL when the variable is absent.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          # The assistant needs a server route; it stays off on Pages.
          NEXT_PUBLIC_AI_ENABLED: 'false'
        run: npm run build:static

      - name: Verify artifact
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BASE: /${{ github.event.repository.name }}
          # Diagnostics: names only, never values. `vars` is a plain object so it
          # can be printed; the Secrets tab is not listable by design, so only the
          # presence of the two names we care about is reported.
          VISIBLE_VARS: ${{ toJSON(vars) }}
          SECRET_URL_PRESENT: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' }}
          SECRET_KEY_PRESENT: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            var_names=$(printf '%s' "${VISIBLE_VARS}" | jq -r 'keys | join(", ")' 2>/dev/null || echo "unreadable")
            echo "::error title=Supabase values are missing::No usable value reached this job. Variable names visible to it: ${var_names:-none}. Secrets with these exact names present: url=$SECRET_URL_PRESENT key=$SECRET_KEY_PRESENT. Add both under Settings -> Secrets and variables -> Actions -> Variables (repository scope). Names must be exactly NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY."
            exit 1
          fi

          test -f out/.nojekyll || { echo "::error::missing .nojekyll"; exit 1; }
          test -f out/404.html || { echo "::error::missing 404.html"; exit 1; }
          test -f out/index.html || { echo "::error::missing index.html"; exit 1; }
          # Supabase sends email/OAuth links here; without it sign-in 404s.
          test -f out/callback/index.html || { echo "::error::missing callback/index.html"; exit 1; }

          grep -q "$BASE/_next/" out/index.html || { echo "::error::assets are not under $BASE"; exit 1; }

          # NEXT_PUBLIC_* values are inlined into the client chunks at build time,
          # not into the prerendered HTML, so look at the whole artifact.
          grep -rqF "$SUPABASE_URL" out/_next/static/chunks \
            || { echo "::error::the Supabase URL did not make it into the client bundle"; exit 1; }
          grep -rqF -- "$SUPABASE_ANON_KEY" out/_next/static/chunks \
            || { echo "::error::the Supabase anon key did not make it into the client bundle"; exit 1; }

          if [ -n "$SERVICE_KEY" ] && grep -rq "$SERVICE_KEY" out; then
            echo "::error::service-role key found in the export"; exit 1
          fi

          # The value given as the *anon* key must really be a public key: a
          # service_role key pasted by mistake would bypass RLS in the browser.
          case "$SUPABASE_ANON_KEY" in
            sb_secret_*)
              echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY holds a secret key (sb_secret_...); use the anon or publishable key"; exit 1 ;;
          esac
          if printf '%s' "$SUPABASE_ANON_KEY" | grep -qi 'service_role'; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY decodes to service_role; use the anon or publishable key"; exit 1
          fi

          echo "artifact ok: $(find out -type f | wc -l) files under $BASE"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
