name: Probe vars

on:
  push:
    branches: [arena/3e66d4c5-note]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Which values arrived
        env:
          V_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          V_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          S_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          S_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          say() { if [ -n "$2" ]; then echo "yes"; else echo "no"; fi; }
          echo "::notice title=PROBE::vars.URL=$(say x "$V_URL") vars.KEY=$(say x "$V_KEY") secrets.URL=$(say x "$S_URL") secrets.KEY=$(say x "$S_KEY") lens=${#V_URL}/${#V_KEY}/${#S_URL}/${#S_KEY}"
