name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Formatting check
        run: npx prettier --check "**/*.{ts,tsx,json,md,css}" --ignore-path .gitignore

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  static-export:
    # CI used to test only the server build, so breakage that existed solely in
    # the GitHub Pages artifact (missing /callback page, wrong base path) shipped
    # unnoticed. This builds exactly what Pages receives.
    name: Static export (GitHub Pages artifact)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_AI_ENABLED: 'false'
        run: npm run build:static

      - name: Check the artifact
        env:
          BASE: /${{ github.event.repository.name }}
        run: |
          set -e
          test -f out/.nojekyll
          test -f out/404.html
          test -f out/index.html
          # Supabase sends auth links here; a static export without it 404s.
          test -f out/callback/index.html
          grep -q "$BASE/_next/" out/index.html
          echo "static artifact ok: $(find out -type f | wc -l) files"

  e2e:
    name: Playwright (public routes)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
