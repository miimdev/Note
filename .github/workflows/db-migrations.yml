name: Link database migrations

# Applies supabase/migrations to the linked project when they change on main.
# Requires the SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD / SUPABASE_PROJECT_ID
# secrets to be configured; the job is skipped otherwise.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Skip when secrets are missing
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: echo "SUPABASE_ACCESS_TOKEN is not set - skipping migrations."

      - name: Push migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
